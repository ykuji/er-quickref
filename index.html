<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ER クイックリファレンス</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ERquickref">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --text:#1a1f2e; --muted:#5c6475;
    --killer:#c0392b; --killerBg:#fdecea; --common:#2874a6; --commonBg:#eaf3fb;
    --chip:#eef1f6; --chipActive:#1f3a5f; --chipActiveText:#fff;
    --border:#e3e7ee; --warn:#b8860b; --warnBg:#fff6d9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px; line-height:1.55}
  header{background:#1f3a5f; color:#fff; padding:10px 14px; position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 6px rgba(0,0,0,.1)}
  header .title{font-weight:700; font-size:16px}
  header .ver{font-size:11px; opacity:.75}
  .disclaimer{background:var(--warnBg); color:var(--warn); border-bottom:1px solid #e8d79a;
    padding:6px 14px; font-size:12px; text-align:center}
  nav.symptoms{background:#fff; border-bottom:1px solid var(--border); padding:10px 10px 12px}
  nav.symptoms .nav-title{font-size:11px; color:var(--muted); margin:0 4px 6px}
  nav.symptoms .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:6px}
  nav.symptoms button{background:#f1f3f8; color:#1a1f2e; border:1.5px solid transparent;
    border-radius:10px; padding:11px 4px; font-size:14px; font-weight:600; cursor:pointer; transition:.15s}
  nav.symptoms button:hover{background:#e4e8f1}
  nav.symptoms button.active{background:#1f3a5f; color:#fff; border-color:#1f3a5f;
    box-shadow:0 2px 6px rgba(31,58,95,.3)}
  main{padding:14px 10px 60px; max-width:900px; margin:0 auto}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px}
  .empty .big{font-size:48px; margin-bottom:8px}
  .filter-row{background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; margin-bottom:12px}
  .filter-row .flabel{font-size:12px; color:var(--muted); margin-bottom:6px}
  .filter-row .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{display:inline-block; padding:5px 10px; border-radius:999px; background:var(--chip);
    color:#1a1f2e; font-size:12px; cursor:pointer; border:1px solid transparent; user-select:none; transition:.1s}
  .chip:hover{background:#e4e8f1}
  .chip.active{background:var(--chipActive); color:var(--chipActiveText); border-color:var(--chipActive)}
  .filter-row .clear{font-size:11px; color:var(--muted); cursor:pointer; text-decoration:underline; margin-left:8px}
  .section-h{font-size:13px; font-weight:700; margin:18px 2px 8px; display:flex; align-items:center; gap:6px}
  .section-h.killer{color:var(--killer)}
  .section-h.common{color:var(--common)}
  .section-h .cnt{font-size:11px; color:var(--muted); font-weight:400}
  .card{background:var(--panel); border-radius:12px; margin-bottom:9px; padding:12px 14px;
    border-left:4px solid var(--common); box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card.killer{border-left-color:var(--killer); background:#fffaf9}
  .card .cname{font-size:15px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px}
  .card.killer .cname::before{content:"🚨"}
  .card .field{font-size:13px; margin:4px 0; display:flex; gap:6px}
  .card .flabel2{color:var(--muted); min-width:62px; flex-shrink:0; font-size:12px; padding-top:1px}
  .card .fval{flex:1}
  .card .action{background:#fff8ea; border-radius:6px; padding:5px 8px; margin-top:5px; font-size:13px}
  .card .rfbadges{display:flex; flex-wrap:wrap; gap:3px; margin-top:6px}
  .rfbadge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px;
    background:#f0e8d0; color:#8a6a1a}
  .card.hidden{display:none}
  /* Patient profile row */
  .profile-row{background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:9px 11px; margin-bottom:12px}
  .profile-row .plabel{font-size:11px; color:var(--muted); margin-bottom:6px}
  .profile-row .pchips{display:flex; flex-wrap:wrap; gap:5px}
  .pchip{display:inline-block; padding:5px 10px; border-radius:999px;
    background:#f1f3f8; color:#1a1f2e; font-size:12px; cursor:pointer;
    border:1.5px solid transparent; user-select:none; transition:.1s}
  .pchip:hover{background:#e4e8f1}
  .pchip.active{background:#1f3a5f; color:#fff; border-color:#1f3a5f}
  .pchip.active::before{content:"✓ "; font-weight:700}
  .card.starred{background:#fff8e5; border-left-width:4px; box-shadow:0 1px 3px rgba(228,169,60,.3)}
  .card.starred.killer{background:#fff4e9}
  .star-marker{display:inline-block; font-size:11px; margin-left:6px;
    background:#f0e8d0; color:#8a6a1a; padding:2px 7px; border-radius:999px; font-weight:600; vertical-align:middle}
  .footer{text-align:center; color:var(--muted); font-size:11px; padding:20px 10px 10px}
  .footer .note{background:var(--warnBg); color:var(--warn); border-radius:8px; padding:8px 12px;
    margin-bottom:8px; font-size:12px; max-width:600px; margin-left:auto; margin-right:auto}
  @media (max-width:600px){
    nav.symptoms .grid{grid-template-columns:repeat(4,1fr)}
    nav.symptoms button{font-size:13px; padding:10px 2px}
    header .title{font-size:14px}
  }
  /* View tabs */
  nav.view-tabs{background:#2d4e7a; display:flex; border-bottom:1px solid var(--border);
    position:sticky; top:38px; z-index:10}
  nav.view-tabs button{flex:1; background:none; border:none; color:#cfd9ea;
    padding:11px 4px; font-size:14px; font-weight:600; cursor:pointer;
    border-bottom:3px solid transparent; transition:.15s}
  nav.view-tabs button:hover{background:rgba(255,255,255,.05); color:#fff}
  nav.view-tabs button.active{color:#fff; border-bottom-color:#fff; background:rgba(255,255,255,.12)}
  /* Score / Renal common */
  .score-picker{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px;
    background:#fff; padding:10px; border-radius:12px; margin-bottom:12px; border:1px solid var(--border)}
  .score-picker button{background:#f1f3f8; border:1.5px solid transparent; border-radius:8px;
    padding:10px 4px; font-size:13px; font-weight:600; cursor:pointer; color:#1a1f2e; transition:.15s}
  .score-picker button:hover{background:#e4e8f1}
  .score-picker button.active{background:#1f3a5f; color:#fff; border-color:#1f3a5f}
  .score-form{background:#fff; border-radius:12px; padding:14px; border:1px solid var(--border); margin-bottom:12px}
  .score-title{font-size:17px; font-weight:700; margin-bottom:4px; color:#1f3a5f}
  .score-desc{font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.5}
  .score-inputs{display:flex; flex-direction:column; gap:9px; margin-bottom:14px}
  .score-check{display:flex; align-items:center; gap:8px; padding:9px 11px;
    background:#f6f7f9; border-radius:8px; cursor:pointer; font-size:14px; user-select:none}
  .score-check input{width:18px; height:18px; cursor:pointer; flex-shrink:0}
  .score-item .score-ilabel{font-size:13px; margin-bottom:4px; color:#1a1f2e; font-weight:500}
  .score-item select, .score-item input[type="number"]{width:100%; padding:9px 11px;
    border:1.5px solid var(--border); border-radius:8px; font-size:14px; background:#fff;
    font-family:inherit; -webkit-appearance:none; appearance:none}
  .score-item select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%235c6475' d='M5 8l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position:right 8px center; padding-right:30px}
  .score-result{background:#f0f7ff; border-left:4px solid #1f3a5f; padding:12px 14px; border-radius:8px}
  .score-value{font-size:26px; font-weight:700; color:#1f3a5f; margin-bottom:4px; line-height:1.1}
  .score-interp{font-size:13px; color:#1a1f2e; line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="title">🩺 ER クイックリファレンス</div>
  <div class="ver">v1 · 教育用</div>
</header>
<div class="disclaimer">⚠ 教育用ツール。臨床判断は必ず主治医・指導医と行うこと。</div>

<nav class="view-tabs" id="viewTabs">
  <button data-v="symptom" class="active">📋 鑑別</button>
  <button data-v="score">🧮 スコア</button>
</nav>

<nav class="symptoms" id="symNav">
  <div class="nav-title">主訴を選択</div>
  <div class="grid" id="symGrid"></div>
</nav>

<main id="main">
  <div class="empty">
    <div class="big">👆</div>
    <div>上から主訴を選んでください</div>
    <div style="margin-top:6px; font-size:12px">致死的疾患（🚨 Killer）を先に、頻度順鑑別が続きます</div>
  </div>
</main>

<div class="footer">
  <div class="note">
    鑑別・検査・対応は代表的・原則的内容。症例個別の判断は主治医の責任で。<br>
    データ送信・個人情報収集 なし / 完全オフライン / 無保証
  </div>
  <div>ER_quickref v1 · 鯨岡裕平（湘南台病院 救急科）· 2026</div>
</div>

const SCORES = {
  qSOFA:{name:"qSOFA",desc:"敗血症スクリーニング（感染疑いで≥2点 → ICU/死亡率↑、乳酸・血液培養を直ちに）",
    items:[
      {key:"sbp",type:"check",label:"収縮期血圧 ≤ 100 mmHg"},
      {key:"rr",type:"check",label:"呼吸数 ≥ 22 /分"},
      {key:"gcs",type:"check",label:"意識障害（GCS < 15）"}
    ],
    calc:v=>(v.sbp?1:0)+(v.rr?1:0)+(v.gcs?1:0),
    interp:s=>s>=2?"⚠ 高リスク（院内死亡率10%以上）：敗血症精査開始":"低リスク（通常経過観察・原疾患治療）"},

  SOFA:{name:"SOFA",desc:"多臓器障害スコア（0-24）。感染+ベースから2点以上↑で敗血症（Sepsis-3）",
    items:[
      {key:"resp",type:"select",label:"呼吸：PaO2/FiO2",options:[
        {v:0,label:"> 400"},{v:1,label:"≤ 400"},{v:2,label:"≤ 300"},{v:3,label:"≤ 200 (人工呼吸)"},{v:4,label:"≤ 100 (人工呼吸)"}
      ]},
      {key:"coag",type:"select",label:"凝固：血小板 (×10³/μL)",options:[
        {v:0,label:"> 150"},{v:1,label:"≤ 150"},{v:2,label:"≤ 100"},{v:3,label:"≤ 50"},{v:4,label:"≤ 20"}
      ]},
      {key:"liver",type:"select",label:"肝：T-Bil (mg/dL)",options:[
        {v:0,label:"< 1.2"},{v:1,label:"1.2-1.9"},{v:2,label:"2.0-5.9"},{v:3,label:"6.0-11.9"},{v:4,label:"≥ 12.0"}
      ]},
      {key:"cv",type:"select",label:"循環：MAP / 昇圧薬",options:[
        {v:0,label:"MAP ≥ 70"},{v:1,label:"MAP < 70"},{v:2,label:"Dop ≤ 5 or ドブタミン"},{v:3,label:"Dop > 5 or Nor ≤ 0.1"},{v:4,label:"Dop > 15 or Nor > 0.1"}
      ]},
      {key:"cns",type:"select",label:"中枢神経：GCS",options:[
        {v:0,label:"15"},{v:1,label:"13-14"},{v:2,label:"10-12"},{v:3,label:"6-9"},{v:4,label:"< 6"}
      ]},
      {key:"renal",type:"select",label:"腎：Cr (mg/dL) or 尿量",options:[
        {v:0,label:"< 1.2"},{v:1,label:"1.2-1.9"},{v:2,label:"2.0-3.4"},{v:3,label:"3.5-4.9 or <500mL/日"},{v:4,label:"≥ 5.0 or <200mL/日"}
      ]}
    ],
    calc:v=>(+v.resp||0)+(+v.coag||0)+(+v.liver||0)+(+v.cv||0)+(+v.cns||0)+(+v.renal||0),
    interp:s=>{
      if(s>=15)return"⚠ 超高リスク（死亡率>80%）";
      if(s>=11)return"⚠ 高リスク（死亡率約50-80%）";
      if(s>=8)return"⚠ 中等リスク（死亡率約20-50%）";
      if(s>=2)return"ベースから2点以上↑で Sepsis-3 診断";
      return"低リスク";
    }},

  GCS:{name:"GCS",desc:"Glasgow Coma Scale（3-15）。≤8 で気道確保・挿管閾値",
    items:[
      {key:"eye",type:"select",label:"開眼 (E)",options:[
        {v:4,label:"自発的 (4)"},{v:3,label:"呼びかけで (3)"},{v:2,label:"痛み刺激で (2)"},{v:1,label:"なし (1)"}
      ]},
      {key:"verbal",type:"select",label:"最良言語反応 (V)",options:[
        {v:5,label:"見当識あり (5)"},{v:4,label:"混乱した会話 (4)"},{v:3,label:"不適切な単語 (3)"},{v:2,label:"理解不能の発声 (2)"},{v:1,label:"なし (1)"}
      ]},
      {key:"motor",type:"select",label:"最良運動反応 (M)",options:[
        {v:6,label:"指示に従う (6)"},{v:5,label:"痛み部位を払う (5)"},{v:4,label:"痛みに屈曲逃避 (4)"},{v:3,label:"異常屈曲 (3)"},{v:2,label:"伸展反応 (2)"},{v:1,label:"なし (1)"}
      ]}
    ],
    calc:v=>(+v.eye||1)+(+v.verbal||1)+(+v.motor||1),
    interp:s=>{
      if(s<=8)return"⚠ 重症（≤8）：気道確保考慮、挿管閾値";
      if(s<=12)return"中等症（9-12）";
      return"軽症（13-15）";
    }},

  NIHSS:{name:"NIHSS",desc:"脳卒中重症度（0-42）。tPA は 4.5h 以内+NIHSS≥4 が原則",
    items:[
      {key:"n1a",type:"select",label:"1a. 意識水準",options:[{v:0,label:"覚醒 (0)"},{v:1,label:"傾眠 (1)"},{v:2,label:"昏迷 (2)"},{v:3,label:"昏睡 (3)"}]},
      {key:"n1b",type:"select",label:"1b. 月年齢質問（2問）",options:[{v:0,label:"両方正解 (0)"},{v:1,label:"片方正解 (1)"},{v:2,label:"両方不正解 (2)"}]},
      {key:"n1c",type:"select",label:"1c. 従命（開閉眼・握手）",options:[{v:0,label:"両方可 (0)"},{v:1,label:"片方可 (1)"},{v:2,label:"両方不可 (2)"}]},
      {key:"n2",type:"select",label:"2. 注視",options:[{v:0,label:"正常 (0)"},{v:1,label:"部分麻痺 (1)"},{v:2,label:"完全麻痺 (2)"}]},
      {key:"n3",type:"select",label:"3. 視野",options:[{v:0,label:"正常 (0)"},{v:1,label:"部分盲 (1)"},{v:2,label:"半盲 (2)"},{v:3,label:"両側盲 (3)"}]},
      {key:"n4",type:"select",label:"4. 顔面麻痺",options:[{v:0,label:"正常 (0)"},{v:1,label:"軽度 (1)"},{v:2,label:"部分 (2)"},{v:3,label:"完全 (3)"}]},
      {key:"n5a",type:"select",label:"5a. 左上肢",options:[{v:0,label:"10秒保持 (0)"},{v:1,label:"下垂 (1)"},{v:2,label:"重力に抗せず落下 (2)"},{v:3,label:"重力に抗せず (3)"},{v:4,label:"全く動かず (4)"}]},
      {key:"n5b",type:"select",label:"5b. 右上肢",options:[{v:0,label:"10秒保持 (0)"},{v:1,label:"下垂 (1)"},{v:2,label:"重力に抗せず落下 (2)"},{v:3,label:"重力に抗せず (3)"},{v:4,label:"全く動かず (4)"}]},
      {key:"n6a",type:"select",label:"6a. 左下肢",options:[{v:0,label:"5秒保持 (0)"},{v:1,label:"下垂 (1)"},{v:2,label:"重力に抗せず落下 (2)"},{v:3,label:"重力に抗せず (3)"},{v:4,label:"全く動かず (4)"}]},
      {key:"n6b",type:"select",label:"6b. 右下肢",options:[{v:0,label:"5秒保持 (0)"},{v:1,label:"下垂 (1)"},{v:2,label:"重力に抗せず落下 (2)"},{v:3,label:"重力に抗せず (3)"},{v:4,label:"全く動かず (4)"}]},
      {key:"n7",type:"select",label:"7. 失調",options:[{v:0,label:"なし (0)"},{v:1,label:"1肢 (1)"},{v:2,label:"2肢 (2)"}]},
      {key:"n8",type:"select",label:"8. 感覚",options:[{v:0,label:"正常 (0)"},{v:1,label:"軽〜中度低下 (1)"},{v:2,label:"重度〜消失 (2)"}]},
      {key:"n9",type:"select",label:"9. 言語",options:[{v:0,label:"正常 (0)"},{v:1,label:"軽〜中度失語 (1)"},{v:2,label:"重度失語 (2)"},{v:3,label:"全失語 (3)"}]},
      {key:"n10",type:"select",label:"10. 構音",options:[{v:0,label:"正常 (0)"},{v:1,label:"軽〜中度 (1)"},{v:2,label:"重度 (2)"}]},
      {key:"n11",type:"select",label:"11. 消去/無視",options:[{v:0,label:"なし (0)"},{v:1,label:"1モダリティ (1)"},{v:2,label:"2モダリティ (2)"}]}
    ],
    calc:v=>Object.keys(v).filter(k=>k.startsWith("n")).reduce((s,k)=>s+(+v[k]||0),0),
    interp:s=>{
      let r="重症度：";
      if(s<=4)r+="軽症（≤4）";
      else if(s<=15)r+="中等症（5-15）";
      else if(s<=20)r+="中〜重症（16-20）";
      else r+="重症（>20）";
      return r+" ／ tPA は 4.5h以内 + NIHSS≥4、血管内治療は 24h以内 + 大血管閉塞";
    }},

  HEART:{name:"HEART",desc:"胸痛→急性冠症候群リスク（0-10）。≤3 低、4-6 中、≥7 高",
    items:[
      {key:"h",type:"select",label:"病歴 (History)",options:[{v:0,label:"疑わしくない (0)"},{v:1,label:"中等度疑わしい (1)"},{v:2,label:"高度疑わしい (2)"}]},
      {key:"e",type:"select",label:"心電図 (ECG)",options:[{v:0,label:"正常 (0)"},{v:1,label:"非特異的変化 (1)"},{v:2,label:"著明ST変化 (2)"}]},
      {key:"a",type:"select",label:"年齢 (Age)",options:[{v:0,label:"< 45歳 (0)"},{v:1,label:"45-64歳 (1)"},{v:2,label:"≥ 65歳 (2)"}]},
      {key:"r",type:"select",label:"リスク因子（HTN/HC/DM/喫煙/家族歴/肥満）",options:[{v:0,label:"なし (0)"},{v:1,label:"1-2項目 (1)"},{v:2,label:"≥3項目 or 動脈硬化既往 (2)"}]},
      {key:"t",type:"select",label:"トロポニン (Troponin)",options:[{v:0,label:"≤ 正常上限 (0)"},{v:1,label:"1-3倍 (1)"},{v:2,label:"> 3倍 (2)"}]}
    ],
    calc:v=>(+v.h||0)+(+v.e||0)+(+v.a||0)+(+v.r||0)+(+v.t||0),
    interp:s=>{
      if(s<=3)return"低リスク（6週 MACE 1.7%）：退院可（厳密な follow）";
      if(s<=6)return"中リスク（6週 MACE 16.6%）：入院精査/連続トロポニン";
      return"⚠ 高リスク（6週 MACE 50%）：ACS 疑い濃厚、循内コンサルト";
    }},

  Wells:{name:"Wells (PE)",desc:"肺塞栓症（PE）臨床予測。改訂版 ≤4 unlikely / >4 likely",
    items:[
      {key:"dvt",type:"check",label:"DVT の臨床所見（下腿腫脹・圧痛）(+3)"},
      {key:"alt",type:"check",label:"PE 以外の鑑別が可能性低い (+3)"},
      {key:"hr",type:"check",label:"HR > 100 /分 (+1.5)"},
      {key:"imm",type:"check",label:"4週以内の術後・固定・長期臥床 (+1.5)"},
      {key:"prev",type:"check",label:"PE/DVT の既往 (+1.5)"},
      {key:"hemo",type:"check",label:"血痰 (+1)"},
      {key:"malig",type:"check",label:"活動性悪性腫瘍 (+1)"}
    ],
    calc:v=>(v.dvt?3:0)+(v.alt?3:0)+(v.hr?1.5:0)+(v.imm?1.5:0)+(v.prev?1.5:0)+(v.hemo?1:0)+(v.malig?1:0),
    interp:s=>s>4?"⚠ PE likely：造影CT推奨":"PE unlikely：D-dimer 陰性なら除外可"},

  PERC:{name:"PERC (PE除外)",desc:"PE 事前確率低い症例の除外基準。8項目すべて該当なし → PE 除外 (<2%)",
    items:[
      {key:"age",type:"check",label:"年齢 ≥ 50 歳"},
      {key:"hr",type:"check",label:"HR ≥ 100 /分"},
      {key:"spo2",type:"check",label:"SpO2 < 95%"},
      {key:"swell",type:"check",label:"片側下腿腫脹"},
      {key:"hemo",type:"check",label:"血痰"},
      {key:"trauma",type:"check",label:"4週以内の外傷・手術"},
      {key:"prev",type:"check",label:"PE/DVT 既往"},
      {key:"horm",type:"check",label:"エストロゲン使用（OCP/HRT）"}
    ],
    calc:v=>["age","hr","spo2","swell","hemo","trauma","prev","horm"].reduce((s,k)=>s+(v[k]?1:0),0),
    interp:s=>s===0?"✓ PE 除外可（<2% PE 確率）：D-dimer 不要":"⚠ PERC 陰性ならず（≥1 項目該当）：D-dimer or 画像精査へ"},

  CURB65:{name:"CURB-65",desc:"市中肺炎重症度（0-5）。≥2 入院、≥3 ICU 検討",
    items:[
      {key:"c",type:"check",label:"C: 意識障害（新規）"},
      {key:"u",type:"check",label:"U: BUN > 20 mg/dL（尿素 > 7 mmol/L）"},
      {key:"r",type:"check",label:"R: 呼吸数 ≥ 30 /分"},
      {key:"b",type:"check",label:"B: SBP < 90 or DBP ≤ 60 mmHg"},
      {key:"a",type:"check",label:"65: 年齢 ≥ 65 歳"}
    ],
    calc:v=>(v.c?1:0)+(v.u?1:0)+(v.r?1:0)+(v.b?1:0)+(v.a?1:0),
    interp:s=>{
      if(s<=1)return"軽症（30日死亡率 <3%）：外来治療可";
      if(s===2)return"中等症（9%）：入院考慮";
      if(s===3)return"⚠ 重症（15-22%）：入院、ICU 検討";
      return"⚠ 超重症（30%以上）：ICU 必須";
    }},

  ADROP:{name:"A-DROP",desc:"成人肺炎重症度（日本呼吸器学会、0-5）",
    items:[
      {key:"a",type:"check",label:"A: 年齢 男性≥70 歳 or 女性≥75 歳"},
      {key:"d",type:"check",label:"D: 脱水（BUN ≥ 21 mg/dL or 脱水所見）"},
      {key:"r",type:"check",label:"R: SpO2 ≤ 90%（PaO2 ≤ 60 Torr）"},
      {key:"o",type:"check",label:"O: 意識障害"},
      {key:"p",type:"check",label:"P: SBP ≤ 90 mmHg"}
    ],
    calc:v=>(v.a?1:0)+(v.d?1:0)+(v.r?1:0)+(v.o?1:0)+(v.p?1:0),
    interp:s=>{
      if(s===0)return"軽症：外来治療";
      if(s<=2)return"中等症：外来 or 入院";
      if(s===3)return"⚠ 重症：入院";
      return"⚠ 超重症：ICU";
    }},

  ABI:{name:"ABI",desc:"足関節上腕血圧比。末梢動脈疾患（PAD/ASO）評価",hideScore:true,
    items:[
      {key:"brRight",type:"num",label:"右上腕 SBP (mmHg)",ph:"例: 130"},
      {key:"brLeft",type:"num",label:"左上腕 SBP (mmHg)",ph:"例: 128"},
      {key:"ankRight",type:"num",label:"右足関節 SBP (mmHg)",ph:"例: 125"},
      {key:"ankLeft",type:"num",label:"左足関節 SBP (mmHg)",ph:"例: 85"}
    ],
    calc:v=>0,
    interp:(s,v)=>{
      const br = Math.max(+v.brRight||0, +v.brLeft||0);
      if(!br) return "4か所の血圧を入力してください";
      const cls = x => {
        if(!x) return "未入力";
        if(x>1.3) return `${x.toFixed(2)}：石灰化・不正確（糖尿病・高齢注意）`;
        if(x>=1.0) return `${x.toFixed(2)}：正常`;
        if(x>=0.9) return `${x.toFixed(2)}：境界`;
        if(x>=0.4) return `${x.toFixed(2)}：⚠ ASO/PAD`;
        return `${x.toFixed(2)}：⚠⚠ 重症虚血`;
      };
      const r = (+v.ankRight||0)/br;
      const l = (+v.ankLeft||0)/br;
      return `右ABI = ${cls(r)}<br>左ABI = ${cls(l)}`;
    }}
};

/* ===== 状態 ===== */
const SYMPTOMS = Object.keys(DB);
let currentView = "symptom";
let currentSym = null;
let currentScore = null;
let scoreValues = {};

/* 患者プロファイル定義（dx の typ+act テキストに対する部分一致） */
const PROFILES = [
  {key:"elderly",      label:"高齢",     kw:["高齢"]},
  {key:"pediatric",    label:"小児",     kw:["小児","乳幼児","学童"]},
  {key:"pregnancy",    label:"妊娠",     kw:["妊娠","妊婦","産後","産褥"]},
  {key:"diabetes",     label:"糖尿病",   kw:["糖尿病","DKA","HHS"]},
  {key:"immune",       label:"免疫抑制", kw:["免疫抑制","化学療法歴","HIV","ステロイド使用","好中球減少"]},
  {key:"anticoag",     label:"抗凝固薬", kw:["抗凝固薬","ワルファリン","DOAC"]},
  {key:"afib",         label:"心房細動", kw:["心房細動"]},
  {key:"trauma",       label:"外傷",     kw:["外傷"]},
  {key:"alcohol",      label:"大量飲酒", kw:["大量飲酒","アルコール離脱","飲酒歴"]},
  {key:"malignancy",   label:"悪性腫瘍", kw:["悪性腫瘍","癌","腫瘍"]}
];
let activeProfiles = new Set();

function matchProfile(dx){
  if(activeProfiles.size === 0) return false;
  const text = (dx.typ || "") + " " + (dx.act || "");
  for(const p of activeProfiles){
    const prof = PROFILES.find(x => x.key === p);
    if(prof && prof.kw.some(k => text.includes(k))) return true;
  }
  return false;
}

/* ===== View 切替 ===== */
function switchView(v){
  currentView = v;
  document.querySelectorAll("#viewTabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.v === v);
  });
  document.getElementById("symNav").style.display = v === "symptom" ? "" : "none";
  if(v === "symptom") render();
  else if(v === "score") renderScoreView();
}

function initViewTabs(){
  document.getElementById("viewTabs").addEventListener("click", e => {
    if(e.target.tagName === "BUTTON") switchView(e.target.dataset.v);
  });
}

/* ===== 鑑別 view ===== */
function initNav(){
  const g = document.getElementById("symGrid");
  g.innerHTML = SYMPTOMS.map(s => `<button data-s="${s}">${s}</button>`).join("");
  g.addEventListener("click", e => {
    if(e.target.tagName === "BUTTON"){
      selectSymptom(e.target.dataset.s);
    }
  });
}

function selectSymptom(s){
  currentSym = s;
  document.querySelectorAll("nav.symptoms button").forEach(b => {
    b.classList.toggle("active", b.dataset.s === s);
  });
  render();
  // iPhone等で選択後に鑑別エリアまで自動スクロール
  setTimeout(() => {
    const m = document.getElementById("main");
    if(m) m.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}

function render(){
  if(currentView !== "symptom") return;
  if(!currentSym){
    document.getElementById("main").innerHTML = `<div class="empty"><div class="big">👆</div><div>上から主訴を選んでください</div></div>`;
    return;
  }
  const d = DB[currentSym];

  const profileRow = `
    <div class="profile-row">
      <div class="plabel">👤 患者プロファイル（該当する鑑別に ⭐ 強調表示）</div>
      <div class="pchips">
        ${PROFILES.map(p => {
          const act = activeProfiles.has(p.key) ? " active" : "";
          return `<span class="pchip${act}" data-p="${p.key}">${p.label}</span>`;
        }).join("")}
      </div>
    </div>
  `;

  const killerCards = d.killers.map(k => cardHtml(k, true)).join("");
  const commonCards = d.common.map(c => cardHtml(c, false)).join("");

  document.getElementById("main").innerHTML = `
    ${profileRow}
    <div class="section-h killer">🚨 Killer 鑑別 <span class="cnt">(${d.killers.length})</span></div>
    ${killerCards}
    <div class="section-h common">📋 Common 鑑別 <span class="cnt">(${d.common.length})</span></div>
    ${commonCards}
  `;

  // Profile chip toggle
  document.querySelectorAll(".pchip[data-p]").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.dataset.p;
      if(activeProfiles.has(k)) activeProfiles.delete(k);
      else activeProfiles.add(k);
      render();
    });
  });
}

function cardHtml(dx, isKiller){
  const starred = matchProfile(dx);
  const star = starred ? ' <span class="star-marker">⭐ 要注意</span>' : '';
  return `
    <div class="card${isKiller ? " killer" : ""}${starred ? " starred" : ""}">
      <div class="cname">${dx.n}${star}</div>
      <div class="field"><div class="flabel2">典型</div><div class="fval">${dx.typ}</div></div>
      <div class="field"><div class="flabel2">検査</div><div class="fval">${dx.tst}</div></div>
      <div class="action"><strong>次の一手：</strong>${dx.act}</div>
    </div>
  `;
}


/* ===== Score view ===== */
function renderScoreView(){
  const picker = Object.keys(SCORES).map(k =>
    `<button data-sc="${k}" class="${currentScore===k?'active':''}">${SCORES[k].name}</button>`
  ).join("");

  let form = "";
  if(currentScore){
    const sdef = SCORES[currentScore];
    const inputs = sdef.items.map(it => {
      if(it.type === "check"){
        const chk = scoreValues[it.key] ? "checked" : "";
        return `<label class="score-check"><input type="checkbox" data-k="${it.key}" ${chk}><span>${it.label}</span></label>`;
      }
      if(it.type === "select"){
        const opts = it.options.map(o => {
          const sel = String(scoreValues[it.key]) === String(o.v) ? "selected" : "";
          return `<option value="${o.v}" ${sel}>${o.label}</option>`;
        }).join("");
        return `<div class="score-item"><div class="score-ilabel">${it.label}</div><select data-k="${it.key}">${opts}</select></div>`;
      }
      if(it.type === "num"){
        const val = scoreValues[it.key] || "";
        return `<div class="score-item"><div class="score-ilabel">${it.label}</div><input type="number" step="any" data-k="${it.key}" value="${val}" placeholder="${it.ph||''}"></div>`;
      }
      return "";
    }).join("");

    form = `
      <div class="score-form">
        <div class="score-title">${sdef.name}</div>
        <div class="score-desc">${sdef.desc}</div>
        <div class="score-inputs">${inputs}</div>
        <div class="score-result" id="scoreResult"></div>
      </div>
    `;
  } else {
    form = `<div class="empty"><div class="big">🧮</div><div>上からスコアを選択</div></div>`;
  }

  document.getElementById("main").innerHTML = `<div class="score-picker">${picker}</div>${form}`;

  document.querySelectorAll("[data-sc]").forEach(b => {
    b.addEventListener("click", () => {
      currentScore = b.dataset.sc;
      scoreValues = {};
      renderScoreView();
    });
  });

  if(currentScore){
    updateScoreResult();
    document.querySelectorAll("[data-k]").forEach(el => {
      const ev = (el.type === "checkbox" || el.tagName === "SELECT") ? "change" : "input";
      el.addEventListener(ev, () => {
        const k = el.dataset.k;
        if(el.type === "checkbox") scoreValues[k] = el.checked;
        else if(el.type === "number") scoreValues[k] = el.value;
        else scoreValues[k] = el.value;
        updateScoreResult();
      });
    });
  }
}

function updateScoreResult(){
  const sdef = SCORES[currentScore];
  if(!sdef) return;
  const s = sdef.calc(scoreValues);
  const interp = sdef.interp(s, scoreValues);
  const el = document.getElementById("scoreResult");
  if(!el) return;
  const scoreHtml = sdef.hideScore ? "" : `<div class="score-value">${s}点</div>`;
  el.innerHTML = `${scoreHtml}<div class="score-interp">${interp}</div>`;
}

initNav();
initViewTabs();

// Service Worker 登録（PWA / オフライン対応）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
